name: main
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  test:
    name: test
    uses: ./.github/workflows/step-test.yml
  release:
    needs: test
    name: release
    permissions:
      packages: write
      contents: write
    uses: ./.github/workflows/step-release.yml
  bump:
    needs: release
    name: bump
    permissions:
      contents: write
    uses: ./.github/workflows/step-bump.yml
